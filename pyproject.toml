[project]
name = "supply-chain-mongodb-agent"
version = "0.1.0"
description = "MongoDB Atlas + LangChain Deep Agents demo for supply chain resolution workflows"
authors = [
    { name = "alxmancilla", email = "alxmancilla@yahoo.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.6",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "langgraph-store-mongodb>=0.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "pymongo>=4.14.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "streamlit>=1.45.0",
    "typer>=0.12.0",
]

[project.scripts]
supply-chain-agent = "supply_chain_mongodb_agent:main"
supply-chain-mongodb-agent = "supply_chain_mongodb_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
